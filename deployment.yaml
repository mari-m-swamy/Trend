apiVersion: apps/v1
kind: Deployment
metadata:
  name: trend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trend
  template:
    metadata:
      labels:
        app: trend
    spec:
      containers:
      - name: trend
        image: 558316745366.dkr.ecr.us-east-1.amazonaws.com/trend-app:latest
        ports:
        - containerPort: 3000
